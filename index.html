  <style>
    :root { color-scheme: light; background: #f8f7f3; color: #20241f; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3vh, 32px);
      padding: 40px 24px 64px;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }
    main::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background-image: radial-gradient(#b4bbb0 0.7px, transparent 0.7px);
      background-size: 24px 24px;
      opacity: .38;
      mask-image: radial-gradient(ellipse 45% 48% at 50% 45%, #000 0%, transparent 100%);
    }
    .scene { width: min(100%, 540px); height: auto; overflow: visible; flex-shrink: 0; }
    h1 {
      width: min(100%, 580px);
      margin: 0;
      line-height: 0;
      position: relative;
    }
    .headline-art { display: block; width: 100%; height: auto; overflow: visible; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .unicorn { transform-origin: 270px 325px; animation: wiggle 4s ease-in-out infinite; }
    .tail { transform-origin: 330px 267px; animation: swish 3s ease-in-out infinite; }
    .sparkle { transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
    .sparkle:nth-of-type(2) { animation-delay: -1.5s; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-5px); } }
    @keyframes swish { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(7deg); } }
    @keyframes twinkle { 0%, 100% { transform: scale(.8) rotate(-8deg); } 50% { transform: scale(1.1) rotate(8deg); } }
    @media (max-width: 480px) {
      main { padding: 32px 20px 56px; gap: 16px; }
      .scene { width: min(112%, 430px); max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .unicorn, .tail, .sparkle { animation: none; }
    }
  </style>
